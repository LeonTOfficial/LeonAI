name: LEON AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is intentionally not used:
        # LEON AI uses modern Python syntax such as `str | None`.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create local test environment
        run: cp .env.example .env

      - name: Run backend and contract tests
        run: python -m unittest discover -s tests -q

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/js/api.js
          node --check static/js/ui.js
          node --check static/js/artifacts.js
          node --check static/js/chat.js
