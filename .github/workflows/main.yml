name: LEON AI Tests & Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Check Python Syntax (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Set up Environment for Testing
      run: |
        cp .env.example .env

    - name: Run Python Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Set up Node.js for JS Check
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install JSHint for JS Syntax Check
      run: npm install -g jshint

    - name: Check JavaScript Syntax
      run: |
        jshint static/js/ --config '{"esversion": 11, "browser": true, "undef": false}' || true
