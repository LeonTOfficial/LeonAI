name: LEON AI Tests & Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8

    - name: Check Python Syntax (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Set up Environment for Testing
      run: |
        if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi

    - name: Run Python Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Set up Node.js for JS Check
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install JSHint for JS Syntax Check
      run: npm install -g jshint

    - name: Check JavaScript Syntax
      run: |
        jshint static/js/ --config '{"esversion": 11, "browser": true, "undef": false}' || true
