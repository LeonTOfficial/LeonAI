name: Security contact request
description: Request private coordination for a possible security issue.
title: "[Security contact requested]"
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include exploit steps, payloads, secrets, private logs, or vulnerability details in this public issue.

        If GitHub Security Advisories are available for this repository, use them. Otherwise, open this minimal contact request so the maintainer can coordinate privately.
  - type: checkboxes
    id: safe
    attributes:
      label: Public safety confirmation
      options:
        - label: I did not include exploit details, secrets, private prompts, API keys, or full logs in this public issue.
          required: true
  - type: textarea
    id: contact
    attributes:
      label: Safe contact note
      description: Keep this minimal. Example: "I found a possible issue in artifact preview and would like private coordination."
